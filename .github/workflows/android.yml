name: Android

on:
  push:
    paths: ["Android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["Android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android build platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build, test, and lint
        run: ./gradlew --no-daemon --no-build-cache assembleDebug testDebugUnitTest lintDebug
      # APK publication is handled through explicit preview releases.
      # Keep verification logs, but do not upload compiled artifacts or build caches.
